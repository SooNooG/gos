{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1>Удаление заявки</h1>
        <p>Вы действительно хотите удалить заявку <strong>{{ service_request.title }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger">Удалить</button>
            <a href="{% url 'request_detail' service_request.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
