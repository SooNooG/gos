{% extends "base.html" %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1>Удаление сотрудника</h1>
        <p>Вы действительно хотите удалить сотрудника <strong>{{ employee.name }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger">Удалить</button>
            <a href="{% url 'employee_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
