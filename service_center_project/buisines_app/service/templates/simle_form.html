{% extends "base.html" %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">
        <h1>{{ title }}</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary">Сохранить</button>
            <a href="{% url 'home' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>

{% endblock %}
